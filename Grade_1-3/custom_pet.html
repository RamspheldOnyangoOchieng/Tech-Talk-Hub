<!DOCTYPE html>
<html>

<head>
    <title>My Custom Pet</title>
    <style>
        body {
            background-color: #e1f5fe;
            text-align: center;
            font-family: 'Comic Sans MS', sans-serif;
            padding: 20px;
        }

        h1 {
            color: #0277bd;
        }

        .pet-container {
            width: 300px;
            height: 300px;
            background-color: white;
            border: 5px solid #0277bd;
            border-radius: 50%;
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 100px;
            position: relative;
        }

        /* The Accessories */
        .accessory {
            position: absolute;
            top: 20px;
            font-size: 60px;
            display: none;
        }

        /* Logic for Buttons */
        input[type="radio"] {
            display: none;
        }

        .options {
            margin-top: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: white;
            border: 2px solid #0277bd;
            border-radius: 20px;
            cursor: pointer;
            margin: 5px;
        }

        input:checked+.btn {
            background-color: #0277bd;
            color: white;
        }

        /* Show parts based on selection */
        #dog:checked~.pet-container::after {
            content: '🐶';
        }

        #cat:checked~.pet-container::after {
            content: '🐱';
        }

        #rabbit:checked~.pet-container::after {
            content: '🐰';
        }

        #hat:checked~.pet-container .accessory {
            display: block;
        }

        /* Change background box color */
        #pink:checked~.pet-container {
            background-color: #fce4ec;
        }

        #blue:checked~.pet-container {
            background-color: #e1f5fe;
        }

        #green:checked~.pet-container {
            background-color: #e8f5e9;
        }
    </style>
</head>

<body>
    <h1>My Digital Pet 🐾</h1>
    <p>Pick your pet, a color, and a hat!</p>

    <!-- Pet Choice -->
    <input type="radio" name="animal" id="dog" checked>
    <label for="dog" class="btn">Puppy</label>

    <input type="radio" name="animal" id="cat">
    <label for="cat" class="btn">Kitty</label>

    <input type="radio" name="animal" id="rabbit">
    <label for="rabbit" class="btn">Bunny</label>

    <br><br>

    <!-- Color Choice -->
    <input type="radio" name="color" id="pink">
    <label for="pink" class="btn">Pink Room</label>

    <input type="radio" name="color" id="blue" checked>
    <label for="blue" class="btn">Blue Room</label>

    <input type="radio" name="color" id="green">
    <label for="green" class="btn">Green Room</label>

    <br><br>

    <!-- Accessory -->
    <input type="checkbox" id="hat">
    <label for="hat" class="btn">Give a Hat! 🎩</label>

    <div class="pet-container">
        <div class="accessory">🎩</div>
    </div>

    <p>You made a special friend!</p>
</body>

</html>
