<!DOCTYPE html>
<html>

<head>
    <title>Simple Drum Game</title>
    <style>
        body {
            background-color: yellow;
            text-align: center;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        h1 {
            font-size: 40px;
            color: red;
        }

        .drum-set {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .drum {
            background-color: white;
            border: 4px solid orange;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            cursor: pointer;
        }

        .drum:hover {
            background-color: #ffcccc;
        }
    </style>
</head>

<body>
    <h1>Tap the Drums!</h1>
    <p>Look at the big drums.</p>

    <div class="drum-set">
        <div class="drum">🥁</div>
        <div class="drum">🥁</div>
        <div class="drum">🥁</div>
    </div>

    <p>Boom! Boom! Boom!</p>
</body>

</html>
