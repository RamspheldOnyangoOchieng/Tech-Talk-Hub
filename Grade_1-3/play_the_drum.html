<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play the Drum</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #2c3e50;
            color: white;
            margin: 0;
        }

        h1 {
            margin-bottom: 50px;
            font-size: 3rem;
            text-shadow: 2px 2px #e74c3c;
        }

        .drum-container {
            display: flex;
            gap: 20px;
        }

        .drum {
            width: 120px;
            height: 120px;
            border: 5px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            background: radial-gradient(circle, #f1c40f, #f39c12);
            box-shadow: 0 10px #d35400;
        }

        .drum:active {
            transform: translateY(10px);
            box-shadow: 0 0px #d35400;
        }

        .drum.playing {
            transform: scale(1.1);
            border-color: #f1c40f;
            box-shadow: 0 0 20px #f1c40f;
        }
    </style>
</head>

<body>
    <h1>Click or Press!</h1>
    <div class="drum-container">
        <div class="drum" onclick="playSound('Boom!')">🥁 Boom</div>
        <div class="drum" onclick="playSound('Clap!')">👏 Clap</div>
        <div class="drum" onclick="playSound('Snare!')">🎵 Snare</div>
        <div class="drum" onclick="playSound('Cymbal!')">✨ Cymbal</div>
        <div class="drum" onclick="playSound('Tinkle!')">🔔 Tinkle</div>
    </div>
    <h2 id="sound-text">Try it!</h2>

    <script>
        // Better quality sounds with longer "tails" (ringing)
        const sounds = {
            'Boom!': new Audio('https://s3.amazonaws.com/freecodecamp/drums/RP4_KICK_1.mp3'),
            'Clap!': new Audio('https://s3.amazonaws.com/freecodecamp/drums/Heater-6.mp3'),
            'Snare!': new Audio('https://s3.amazonaws.com/freecodecamp/drums/Brk_Snr.mp3'),
            'Cymbal!': new Audio('https://s3.amazonaws.com/freecodecamp/drums/Dsc_Oh.mp3'),
            'Tinkle!': new Audio('https://s3.amazonaws.com/freecodecamp/drums/Kick_n_Hat.mp3')
        };

        function playSound(name) {
            const sound = sounds[name];
            if (sound) {
                sound.currentTime = 0;
                sound.volume = 1.0;
                sound.play();

                // Visual "Prolonging" effect
                const text = document.getElementById('sound-text');
                text.innerText = name;
                text.style.transition = 'none';
                text.style.transform = 'scale(2)';
                text.style.opacity = '1';
                text.style.color = '#f1c40f';
                text.style.textShadow = '0 0 20px #f1c40f';

                // Slow fade out visually (like the sound)
                setTimeout(() => {
                    text.style.transition = 'all 2s ease-out';
                    text.style.transform = 'scale(1)';
                    text.style.opacity = '0.3';
                    text.style.textShadow = 'none';
                }, 50);
            }
        }
    </script>
</body>

</html>
