<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #667eea;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 400px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            border: none;
            color: white;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #5a67d8;
        }

        .error {
            color: #e53e3e;
            font-size: 0.8rem;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Join Us</h2>
        <form id="regForm" onsubmit="return validate(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" required>
                <div class="error" id="userError">Username must be at least 3 characters.</div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required>
                <div class="error" id="passError">Password must be at least 6 characters.</div>
            </div>
            <button type="submit">Register</button>
        </form>
    </div>

    <script>
        function validate(event) {
            event.preventDefault();
            let valid = true;
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user.length < 3) {
                document.getElementById('userError').style.display = 'block';
                valid = false;
            } else {
                document.getElementById('userError').style.display = 'none';
            }

            if (pass.length < 6) {
                document.getElementById('passError').style.display = 'block';
                valid = false;
            } else {
                document.getElementById('passError').style.display = 'none';
            }

            if (valid) {
                alert("Successful Registration for: " + user);
            }
            return false;
        }
    </script>
</body>

</html>
