<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Quest - Gamified Guessing</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --success: #22c55e;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
        }

        .container {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            margin-bottom: 2rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input[type="number"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem;
            font-size: 1.5rem;
            color: white;
            text-align: center;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
        }

        /* Remove arrows from number input */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 0.75rem;
        }

        .btn-primary {
            background: linear-gradient(to right, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            color: white;
        }

        .feedback {
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .hint {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .difficulty-selector {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .difficulty-btn {
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            cursor: pointer;
        }

        .difficulty-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Particles effect */
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-5px);
            }

            75% {
                transform: translateX(5px);
            }
        }

        .shake {
            animation: shake 0.2s ease-in-out 0s 2;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }

        .bounce {
            animation: bounce 1s;
        }

        .history {
            margin-top: 2rem;
            max-height: 100px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            scrollbar-width: none;
        }

        .history::-webkit-scrollbar {
            display: none;
        }

        .history-tag {
            padding: 0.25rem 0.6rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            font-size: 0.8rem;
            color: #64748b;
        }

        .history-tag.low {
            color: #60a5fa;
        }

        .history-tag.high {
            color: #f87171;
        }
    </style>
</head>

<body>
    <div id="particles-js"></div>

    <div class="container" id="game-container">
        <h1>Number Quest</h1>
        <p class="subtitle">Can you solve the mystery?</p>

        <div class="difficulty-selector">
            <button class="difficulty-btn active" onclick="setDifficulty(100, this)">1-100</button>
            <button class="difficulty-btn" onclick="setDifficulty(500, this)">1-500</button>
            <button class="difficulty-btn" onclick="setDifficulty(1000, this)">1-1000</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Attempts</div>
                <div class="stat-value" id="attempts">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">High Score</div>
                <div class="stat-value" id="high-score">-</div>
            </div>
        </div>

        <div class="input-group">
            <input type="number" id="guess-input" placeholder="?" autocomplete="off">
        </div>

        <button class="btn btn-primary" onclick="checkGuess()">GUESS</button>
        <button class="btn btn-secondary" onclick="resetGame()">RESET</button>

        <div class="feedback" id="feedback">
            <span class="hint">Enter a number to start!</span>
        </div>

        <div class="history" id="history"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        let targetNumber;
        let attempts = 0;
        let maxRange = 100;
        let highScore = localStorage.getItem('guess_high_score') || '-';
        let gameOver = false;

        document.getElementById('high-score').innerText = highScore;

        function initGame() {
            targetNumber = Math.floor(Math.random() * maxRange) + 1;
            attempts = 0;
            gameOver = false;
            document.getElementById('attempts').innerText = '0';
            document.getElementById('feedback').innerHTML = `<span class="hint">I'm thinking of a number between 1 and ${maxRange}</span>`;
            document.getElementById('feedback').style.color = 'var(--text)';
            document.getElementById('guess-input').value = '';
            document.getElementById('guess-input').disabled = false;
            document.getElementById('history').innerHTML = '';
            console.log("Secret:", targetNumber); // Keep for debugging if needed
        }

        function setDifficulty(range, btn) {
            maxRange = range;
            document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initGame();
        }

        function checkGuess() {
            if (gameOver) return;

            const input = document.getElementById('guess-input');
            const guess = parseInt(input.value);
            const feedback = document.getElementById('feedback');
            const container = document.getElementById('game-container');

            if (isNaN(guess)) {
                feedback.innerText = "Please enter a valid number!";
                feedback.style.color = 'var(--error)';
                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 400);
                return;
            }

            attempts++;
            document.getElementById('attempts').innerText = attempts;
            addToHistory(guess);

            if (guess === targetNumber) {
                winGame();
            } else {
                const diff = Math.abs(guess - targetNumber);
                if (guess < targetNumber) {
                    feedback.innerText = "Too low! Aim higher ⬆️";
                    feedback.style.color = '#60a5fa';
                } else {
                    feedback.innerText = "Too high! Aim lower ⬇️";
                    feedback.style.color = '#f87171';
                }

                // Visual heat indicator
                if (diff < 5) {
                    feedback.innerHTML += " <br> <small>You're burning up! 🔥</small>";
                } else if (diff < 15) {
                    feedback.innerHTML += " <br> <small>You're getting warm! ☀️</small>";
                }

                container.classList.add('shake');
                setTimeout(() => container.classList.remove('shake'), 200);
            }

            input.value = '';
            input.focus();
        }

        function winGame() {
            gameOver = true;
            const feedback = document.getElementById('feedback');
            feedback.innerHTML = `🌟 BRILLIANT! 🌟<br>You found it in ${attempts} tries!`;
            feedback.style.color = 'var(--success)';
            document.getElementById('guess-input').disabled = true;
            document.getElementById('game-container').classList.add('bounce');

            if (highScore === '-' || attempts < highScore) {
                highScore = attempts;
                localStorage.setItem('guess_high_score', highScore);
                document.getElementById('high-score').innerText = highScore;
                feedback.innerHTML += "<br>New Record! 🎉";
            }
        }

        function addToHistory(guess) {
            const history = document.getElementById('history');
            const tag = document.createElement('span');
            tag.className = 'history-tag ' + (guess < targetNumber ? 'low' : guess > targetNumber ? 'high' : '');
            tag.innerText = guess;
            history.prepend(tag);
        }

        function resetGame() {
            document.getElementById('game-container').classList.remove('bounce');
            initGame();
        }

        // Enter key support
        document.getElementById('guess-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkGuess();
        });

        // Initialize particles
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#6366f1" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.2 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#6366f1", "opacity": 0.1, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            },
            "interactivity": {
                "events": { "onhover": { "enable": true, "mode": "repulse" } }
            }
        });

        initGame();
    </script>
</body>

</html>
