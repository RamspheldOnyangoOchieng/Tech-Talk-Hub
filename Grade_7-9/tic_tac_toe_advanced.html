<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Better Tic-Tac-Toe</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: #16213e;
            border: 2px solid #0f3460;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            cursor: pointer;
            border-radius: 10px;
        }

        .cell:hover {
            background: #0f3460;
        }

        .status {
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .controls {
            margin-top: 20px;
        }

        button {
            padding: 8px 16px;
            margin: 5px;
            cursor: pointer;
            border-radius: 5px;
            border: none;
            background: #e94560;
            color: white;
        }
    </style>
</head>

<body>
    <div class="status" id="status">X's Turn</div>
    <div class="board" id="board">
        <div class="cell" onclick="move(0)"></div>
        <div class="cell" onclick="move(1)"></div>
        <div class="cell" onclick="move(2)"></div>
        <div class="cell" onclick="move(3)"></div>
        <div class="cell" onclick="move(4)"></div>
        <div class="cell" onclick="move(5)"></div>
        <div class="cell" onclick="move(6)"></div>
        <div class="cell" onclick="move(7)"></div>
        <div class="cell" onclick="move(8)"></div>
    </div>
    <div class="controls">
        <button onclick="reset()">Reset</button>
        <button onclick="toggleMode()">Mode: <span id="mode-text">Multiplayer</span></button>
    </div>

    <script>
        let board = Array(9).fill(null);
        let turn = 'X';
        let vsComputer = false;
        let active = true;

        function move(i) {
            if (!active || board[i]) return;

            board[i] = turn;
            render();

            if (checkWin()) {
                document.getElementById('status').innerText = turn + ' Wins!';
                active = false;
                return;
            }
            if (board.every(b => b)) {
                document.getElementById('status').innerText = 'Draw!';
                active = false;
                return;
            }

            turn = turn === 'X' ? 'O' : 'X';
            document.getElementById('status').innerText = turn + "'s Turn";

            if (vsComputer && turn === 'O' && active) {
                setTimeout(computerMove, 500);
            }
        }

        function computerMove() {
            let empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
            if (empty.length > 0) {
                let randomCell = empty[Math.floor(Math.random() * empty.length)];
                move(randomCell);
            }
        }

        function checkWin() {
            const wins = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];
            return wins.some(c => board[c[0]] && board[c[0]] === board[c[1]] && board[c[1]] === board[c[2]]);
        }

        function render() {
            document.querySelectorAll('.cell').forEach((c, i) => c.innerText = board[i] || '');
        }

        function reset() {
            board = Array(9).fill(null);
            turn = 'X';
            active = true;
            document.getElementById('status').innerText = "X's Turn";
            render();
        }

        function toggleMode() {
            vsComputer = !vsComputer;
            document.getElementById('mode-text').innerText = vsComputer ? 'vs Computer' : 'Multiplayer';
            reset();
        }
    </script>
</body>

</html>
